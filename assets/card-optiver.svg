<svg xmlns="http://www.w3.org/2000/svg" width="470" height="190" viewBox="0 0 470 190" role="img" aria-label="Optiver hackathon — 3rd of ~80 teams">
<style>
svg{font-family:ui-monospace,'JetBrains Mono','Fira Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes rise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:.6}}
.b2{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:rise .7s cubic-bezier(.2,.9,.3,1.15) 0.35s forwards}
.t2{opacity:0;animation:pop .35s ease-out 0.9s forwards}
.b1{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:rise .7s cubic-bezier(.2,.9,.3,1.15) 0.15s forwards}
.t1{opacity:0;animation:pop .35s ease-out 0.7000000000000001s forwards}
.b3{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:rise .7s cubic-bezier(.2,.9,.3,1.15) 0.65s forwards}
.t3{opacity:0;animation:pop .35s ease-out 1.2000000000000002s forwards}
@media (prefers-reduced-motion:reduce){.b1,.b2,.b3{transform:none!important}}
.halo{animation:glow 2.2s ease-in-out 1.4s infinite;opacity:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<rect x="1" y="1" width="468" height="188" rx="10" fill="#0d1117" stroke="#30363d"/>

<text x="24" y="44" font-size="24" font-weight="800" fill="#e6edf3">optiver hackathon</text>
<text x="446" y="39" font-size="12" fill="#8b949e" text-anchor="end">nov 2026</text>
<text x="24" y="98" font-size="36" font-weight="800" fill="#7ee787">3rd</text>
<text x="96" y="98" font-size="16" fill="#e6edf3">/ ~80 teams</text>
<text x="24" y="128" font-size="13" fill="#8b949e">python market-making bot</text>
<text x="24" y="148" font-size="13" fill="#8b949e">on optibook</text>
<line x1="280" x2="448" y1="160" y2="160" stroke="#30363d"/>
<rect class="halo" x="388" y="118" width="56" height="48" rx="8" fill="none" stroke="#7ee787" stroke-width="2"/><rect class="b2" x="290" y="110" width="44" height="50" rx="4" fill="#30363d"/><text class="t2" x="312" y="130" font-size="15" font-weight="700" fill="#8b949e" text-anchor="middle">2</text><rect class="b1" x="342" y="86" width="44" height="74" rx="4" fill="#30363d"/><text class="t1" x="364" y="106" font-size="15" font-weight="700" fill="#8b949e" text-anchor="middle">1</text><rect class="b3" x="394" y="124" width="44" height="36" rx="4" fill="#7ee787"/><text class="t3" x="416" y="144" font-size="15" font-weight="700" fill="#0d1117" text-anchor="middle">3</text>
<text x="24" y="176.5" font-size="12" fill="#8b949e">team of 3 · ~300 participants</text>
</svg>
